<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Palette AIX">
  <defs>
    <radialGradient id="xbg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0b0a1f"/>
    </radialGradient>
    <linearGradient id="xstrokeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="xstrokeB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="xcoreGlow" cx="0.5" cy="0.5" r="0.4">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="48" fill="url(#xbg)"/>
  <!-- Center halo -->
  <circle cx="100" cy="100" r="62" fill="url(#xcoreGlow)"/>
  <!-- X strokes -->
  <g stroke-linecap="round" fill="none" stroke-width="26">
    <line x1="56" y1="56" x2="144" y2="144" stroke="url(#xstrokeA)"/>
    <line x1="144" y1="56" x2="56" y2="144" stroke="url(#xstrokeB)"/>
  </g>
  <!-- Center bright dot -->
  <circle cx="100" cy="100" r="9" fill="#ffffff"/>
</svg>
