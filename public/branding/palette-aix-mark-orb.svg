<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Palette AIX">
  <defs>
    <radialGradient id="orbBg" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="dotA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="dotB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="dotC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="sparkleG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <!-- Rounded square base -->
  <rect width="200" height="200" rx="48" fill="url(#orbBg)"/>
  <!-- Curved palette arc (suggests paint palette) -->
  <path d="M 38,110 Q 38,42 100,42 Q 162,42 162,110 Q 162,162 110,164 L 100,144 L 90,164 Q 38,162 38,110 Z"
        fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Three paint dots arranged like palette colors -->
  <circle cx="74" cy="92" r="14" fill="url(#dotA)"/>
  <circle cx="126" cy="92" r="14" fill="url(#dotC)"/>
  <circle cx="100" cy="128" r="14" fill="url(#dotB)"/>
  <!-- AI sparkle accent on top-right corner -->
  <g transform="translate(154,52)">
    <path d="M0,-18 C2.4,-5.4 5.4,-2.4 18,0 C5.4,2.4 2.4,5.4 0,18 C-2.4,5.4 -5.4,2.4 -18,0 C-5.4,-2.4 -2.4,-5.4 0,-18 Z" fill="url(#sparkleG)"/>
  </g>
</svg>
